version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigma_postgres
    environment:
      POSTGRES_DB: sigma_db
      POSTGRES_USER: sigma_user
      POSTGRES_PASSWORD: sigma_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:f